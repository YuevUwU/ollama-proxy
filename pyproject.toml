[project]
name = "ollama-proxy"
version = "0.1.0"
description = "This intercepts Ollama-style API requests and transforms them into OpenAI-compatible requests for LM Studio. "
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "asyncio>=4.0.0",
    "fastapi>=0.128.2",
    "httpx>=0.28.1",
    "uvicorn>=0.39.0",
]
license = "MIT"
license-files = ["LICENSE"]
authors = ["iDurant"]
